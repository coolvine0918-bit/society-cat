<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사회 12단원 레트로 고양이 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body {
            font-family: 'Galmuri11', sans-serif;
            background-color: #1a202c; 
            color: #fff;
            user-select: none; 
            -webkit-user-select: none;
            touch-action: pan-y; 
            overflow-x: hidden;
        }
        .retro-box {
            background-color: #2d3748;
            border: 4px solid #cbd5e0;
            box-shadow: 6px 6px 0px #000;
            border-radius: 8px;
        }
        .retro-btn {
            background-color: #4a5568;
            border: 4px solid #cbd5e0;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s;
            cursor: pointer;
        }
        .retro-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }
        .typing-text {
            border-right: 0.2em solid orange;
            white-space: pre-wrap;
            word-break: keep-all;
            animation: blink-caret 0.75s step-end infinite;
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: orange; }
        }
        #mg-playarea {
            touch-action: none; 
            overflow: hidden;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div id="intro-screen" class="w-full max-w-md retro-box p-6 flex flex-col items-center text-center">
        <h1 class="text-3xl font-bold mb-6 text-yellow-300 drop-shadow-md">사회 12단원<br>기본권 구제 퀴즈</h1>
        <div class="text-6xl mb-6">🐱</div>
        <p class="mb-6 text-sm text-gray-300">고양이와 함께 핵심 용어를 배우고<br>쥐 잡기 미니게임도 즐겨보자냥!</p>
        
        <input type="number" id="student-id" placeholder="학번 (예: 10701)" class="w-full mb-3 p-3 text-black text-center font-bold border-4 border-gray-400 focus:outline-none" />
        <input type="text" id="student-name" placeholder="이름 (예: 홍길동)" class="w-full mb-6 p-3 text-black text-center font-bold border-4 border-gray-400 focus:outline-none" />
        
        <button onclick="startGame()" class="retro-btn w-full py-4 text-xl font-bold text-yellow-300">게임 시작하기!</button>
    </div>

    <div id="quiz-screen" class="w-full max-w-md hidden flex-col h-[90vh]">
        <div class="flex justify-between items-center mb-4 text-yellow-300 font-bold text-lg">
            <span id="stage-info">STAGE 1 (0/5)</span>
            <span id="score-info">총점: 0</span>
        </div>

        <div class="retro-box p-4 mb-4 flex-1 flex flex-col items-center justify-center relative">
            <div id="equipped-item" class="absolute text-5xl z-10 transition-transform duration-300" style="top: 10px; transform: scale(0);"></div>
            <div id="cat-character" class="text-7xl mb-4 transition-transform duration-200">🐱</div>
            <div class="bg-white text-black p-4 rounded-lg border-4 border-gray-400 w-full min-h-[100px] flex items-center justify-center">
                <p id="question-text" class="text-lg font-bold text-center typing-text"></p>
            </div>
        </div>

        <div id="options-container" class="flex flex-col gap-3">
            <button class="retro-btn py-4 text-lg font-bold" onclick="checkAnswer(0)" id="btn-0"></button>
            <button class="retro-btn py-4 text-lg font-bold" onclick="checkAnswer(1)" id="btn-1"></button>
            <button class="retro-btn py-4 text-lg font-bold" onclick="checkAnswer(2)" id="btn-2"></button>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center z-50 p-4">
        <div class="retro-box p-6 w-full max-w-sm flex flex-col items-center text-center">
            <h2 id="modal-title" class="text-2xl font-bold mb-4 text-yellow-300"></h2>
            <p id="modal-content" class="mb-6 text-lg"></p>
            
            <div id="gift-selection" class="hidden flex justify-center gap-4 mb-6 w-full">
                <button class="retro-btn w-20 h-20 text-4xl flex items-center justify-center" onclick="selectGift(0)" id="gift-btn-0"></button>
                <button class="retro-btn w-20 h-20 text-4xl flex items-center justify-center" onclick="selectGift(1)" id="gift-btn-1"></button>
                <button class="retro-btn w-20 h-20 text-4xl flex items-center justify-center" onclick="selectGift(2)" id="gift-btn-2"></button>
            </div>

            <button id="modal-btn" class="retro-btn px-8 py-3 text-lg font-bold">확인</button>
        </div>
    </div>

    <div id="minigame-screen" class="fixed inset-0 bg-black bg-opacity-95 hidden flex-col items-center justify-center z-50 p-4">
        <div class="w-full max-w-md h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 text-xl font-bold text-yellow-300">
                <span>남은 시간: <span id="mg-timer" class="text-red-400 text-2xl">15</span>초</span>
                <span>잡은 쥐: <span id="mg-score">0</span>마리</span>
            </div>
            <!-- 게임 영역에 손가락 커서 적용 -->
            <div id="mg-playarea" class="flex-1 relative bg-[#8bac0f] rounded-lg border-4 border-gray-300 shadow-[inset_0_0_20px_rgba(0,0,0,0.5)] cursor-pointer">
                <!-- 드래그할 고양이 (기준점을 정중앙으로 설정) -->
                <div id="mg-cat" class="absolute text-6xl md:text-7xl pointer-events-none" style="left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30; transition: transform 0.05s linear;">🐱</div>
            </div>
            <p class="text-center text-gray-400 text-sm mt-4 animate-pulse">화면을 터치한 채로 펜이나 손가락을 움직여 쥐를 잡으세요!</p>
        </div>
    </div>

    <script>
        // ★★★ 구글 앱스 스크립트 웹 앱 URL을 여기에 붙여넣으세요! ★★★
        const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA1GeI1BsF_q0P8BjU8Y04NpzMpFBN-dVF1pzMvp3jiIkzsSp4y-2C8uoi9f-TGGJp/exec"; 

        const wordData = [
            { word: "기본권", meaning: "헌법에 의해 보장되는 국민의 기본적인 권리" },
            { word: "침해", meaning: "권리나 이익을 함부로 건드려 해를 끼치는 일" },
            { word: "구제", meaning: "자연재해나 사회적 피해를 당하여 어려운 처지에 있는 사람을 도와주는 것" },
            { word: "국가기관", meaning: "국가의 의사를 결정하고 표시하는 기관 (예: 법원, 헌법재판소 등)" },
            { word: "분쟁", meaning: "개인이나 단체 사이에서 권리나 이익을 둘러싸고 일어나는 다툼" },
            { word: "법원", meaning: "재판을 하여 침해된 기본권을 구제해 주는 국가기관" },
            { word: "재판", meaning: "법원에서 법적 분쟁을 법률에 따라 해결하는 절차" },
            { word: "소 제기", meaning: "기본권을 침해당한 사람이 법원에 재판으로 문제를 해결해 달라고 청구하는 일" },
            { word: "조정", meaning: "분쟁 발생 시 제3자(법원 등)가 개입하여 양측의 타협과 합의를 이끌어내는 절차" },
            { word: "화해", meaning: "분쟁 당사자가 서로 양보하여 다툼을 끝내기로 합의하는 것" },
            { word: "위자료", meaning: "정신적 고통이나 피해를 입은 것에 대하여 배상으로 지급하는 돈" },
            { word: "헌법재판소", meaning: "공권력에 의해 기본권을 침해당한 사건이 헌법에 보장된 기본권을 침해하였는지 판단하는 기관" },
            { word: "공권력", meaning: "국가나 공공 단체가 국민에게 명령하고 강제할 수 있는 권력" },
            { word: "헌법 소원", meaning: "공권력에 의해 기본권을 침해받은 본인이 다른 구제 절차를 거친 후 헌법재판소에 심판을 청구하는 제도" },
            { word: "국가 인권 위원회", meaning: "국가기관에 의한 기본권 침해나 단체에 의한 부당한 차별을 조사하여 바로잡아 주는 기관" },
            { word: "차별", meaning: "합리적인 이유 없이 등급이나 수준 등에 따라 차이를 두어 불이익을 주는 행위" },
            { word: "진정", meaning: "국가기관에 자신의 사정을 말하고 어떤 조치를 취해 줄 것을 희망하는 일" },
            { word: "자유권", meaning: "국가 권력의 간섭을 받지 않고 자유롭게 생활할 수 있는 권리" },
            { word: "초상권", meaning: "자기의 얼굴이나 모습이 허락 없이 촬영되거나 공표되지 않을 권리" },
            { word: "행동 및 표현의 자유", meaning: "자신의 생각이나 의견을 자유롭게 나타내고 행동할 수 있는 권리" },
            { word: "국민 권익 위원회", meaning: "국가기관의 잘못된 법 집행 등으로 피해를 본 국민이 제기한 고충 민원을 조사하고 구제해 주는 기관" },
            { word: "행정 기관", meaning: "행정 사무를 맡아보는 국가기관이나 지방 자치 단체 (예: 구청 등)" },
            { word: "법 집행", meaning: "행정·사법 기관이 특별한 사건에 대하여 관련 법규를 적용하는 행위" },
            { word: "고충 민원", meaning: "행정 기관의 잘못된 법 집행이나 부당한 처분으로 피해를 입은 국민이 제기하는 불만이나 요구" },
            { word: "행정 심판", meaning: "행정 기관의 잘못된 처분 등으로 권리나 이익을 침해받은 국민이 행정 기관에 제기하는 권리 구제 절차" }
        ];

        let studentId = "";
        let studentName = "";
        let currentStage = 1;
        let questionIndex = 0;
        let stageScore = 0;
        let totalScore = 0;
        let totalMgScore = 0; 
        let currentAnswers = [];
        let typingTimeout;
        
        const allRewards = ['🍔', '🎮', '🕶️', '🚀', '🎀', '🐟', '🧶', '👑', '🍕', '🍰', '⚽', '🎸', '📱', '💎', '🧸', '🍦', '🍩', '🎈', '🎁'];
        let currentGiftOptions = [];

        let isCatDragging = false;
        let mice = [];
        const MAX_MICE = 5; // 쥐 개수 엄격 제한
        let mgTime = 15;
        let currentMgScore = 0;
        let mgTimerInterval;
        let collisionReqId;
        let mgEventsAttached = false;

        // 볼륨을 크게 설정한 신디사이저 엔진 초기화
        const synth = new Tone.Synth({
            oscillator: { type: "square" },
            envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.1 }
        }).toDestination();
        synth.volume.value = 10; 

        function playCorrectSound() {
            if (Tone.context.state !== 'running') Tone.context.resume();
            synth.triggerAttackRelease("C5", "8n");
            setTimeout(() => synth.triggerAttackRelease("E5", "8n"), 100);
            setTimeout(() => synth.triggerAttackRelease("G5", "4n"), 200);
        }

        function playWrongSound() {
            if (Tone.context.state !== 'running') Tone.context.resume();
            synth.triggerAttackRelease("C3", "4n");
        }

        function playMeowSound() {
            if (Tone.context.state !== 'running') Tone.context.resume();
            const meowSynth = new Tone.Synth({
                oscillator: { type: "triangle" },
                envelope: { attack: 0.1, decay: 0.2, sustain: 0.5, release: 0.8 }
            }).toDestination();
            meowSynth.volume.value = 12; 
            meowSynth.triggerAttackRelease("E4", "0.5s");
            meowSynth.frequency.rampTo("C5", 0.2);
            meowSynth.frequency.rampTo("G4", 0.5, "+0.2");
        }

        function playCatchSound() {
            if (Tone.context.state !== 'running') Tone.context.resume();
            const popSynth = new Tone.Synth({
                oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            popSynth.volume.value = 8;
            popSynth.triggerAttackRelease("C6", "32n");
        }

        async function startGame() {
            const idInput = document.getElementById('student-id').value.trim();
            const nameInput = document.getElementById('student-name').value.trim();
            
            if(!idInput || !nameInput) {
                alert("학번과 이름을 모두 입력해주세요!");
                return;
            }
            studentId = idInput;
            studentName = nameInput;
            
            await Tone.start();

            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('flex');
            
            loadQuestion();
        }

        function loadQuestion() {
            const dataIndex = (currentStage - 1) * 5 + questionIndex;
            if (dataIndex >= wordData.length || questionIndex >= 5) {
                endStage();
                return;
            }

            const currentData = wordData[dataIndex];
            document.getElementById('stage-info').innerText = `STAGE ${currentStage} (${questionIndex + 1}/5)`;
            
            const qText = document.getElementById('question-text');
            qText.innerText = "";
            clearTimeout(typingTimeout);
            let charIndex = 0;
            function typeWriter() {
                if (charIndex < currentData.meaning.length) {
                    qText.innerText += currentData.meaning.charAt(charIndex);
                    charIndex++;
                    typingTimeout = setTimeout(typeWriter, 40);
                }
            }
            typeWriter();

            currentAnswers = [currentData.word];
            let tempWords = wordData.map(d => d.word).filter(w => w !== currentData.word);
            
            for(let i=0; i<2; i++) {
                const randIdx = Math.floor(Math.random() * tempWords.length);
                currentAnswers.push(tempWords[randIdx]);
                tempWords.splice(randIdx, 1);
            }
            
            currentAnswers.sort(() => Math.random() - 0.5);
            
            for(let i=0; i<3; i++) {
                const btn = document.getElementById(`btn-${i}`);
                btn.innerText = currentAnswers[i];
                btn.classList.remove('bg-green-600', 'bg-red-600');
                btn.classList.add('bg-[#4a5568]');
                btn.disabled = false;
            }
            
            document.getElementById('cat-character').innerText = "🐱";
            document.getElementById('cat-character').style.transform = "scale(1)";
        }

        function checkAnswer(selectedIndex) {
            const dataIndex = (currentStage - 1) * 5 + questionIndex;
            const correctAnswer = wordData[dataIndex].word;
            const selectedWord = currentAnswers[selectedIndex];
            
            for(let i=0; i<3; i++) {
                document.getElementById(`btn-${i}`).disabled = true;
            }

            const cat = document.getElementById('cat-character');

            if(selectedWord === correctAnswer) {
                playCorrectSound();
                document.getElementById(`btn-${selectedIndex}`).classList.replace('bg-[#4a5568]', 'bg-green-600');
                cat.innerText = "😻";
                cat.style.transform = "scale(1.2)";
                stageScore++;
                totalScore++;
                document.getElementById('score-info').innerText = `총점: ${totalScore}`;
            } else {
                playWrongSound();
                document.getElementById(`btn-${selectedIndex}`).classList.replace('bg-[#4a5568]', 'bg-red-600');
                cat.innerText = "🙀";
                cat.style.transform = "scale(0.9)";
                for(let i=0; i<3; i++) {
                    if(currentAnswers[i] === correctAnswer) {
                        document.getElementById(`btn-${i}`).classList.replace('bg-[#4a5568]', 'bg-green-600');
                    }
                }
            }

            questionIndex++;
            setTimeout(loadQuestion, 1500);
        }

        function endStage() {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            const btn = document.getElementById('modal-btn');
            const giftArea = document.getElementById('gift-selection');
            
            title.innerText = `STAGE ${currentStage} 클리어!`;
            
            if (stageScore >= 3) {
                content.innerHTML = `대단하다냥! ${stageScore}문제나 맞혔어!<br>나에게 줄 선물을 골라줘!`;
                giftArea.classList.remove('hidden');
                btn.classList.add('hidden'); 
                
                let tempItems = [...allRewards];
                tempItems.sort(() => Math.random() - 0.5);
                currentGiftOptions = tempItems.slice(0, 3);
                
                for(let i=0; i<3; i++) {
                    document.getElementById(`gift-btn-${i}`).innerText = currentGiftOptions[i];
                }
            } else {
                content.innerHTML = `조금 아쉽다냥... (${stageScore}문제 정답)<br>분발해서 다음엔 꼭 선물을 줘!<br><br><b>이제 쥐 잡기 미니게임 시작!</b>`;
                giftArea.classList.add('hidden');
                btn.classList.remove('hidden');
                btn.innerText = "미니게임 시작";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    startMiniGame();
                };
            }
            modal.classList.remove('hidden');
        }

        function selectGift(index) {
            playMeowSound(); 
            const selectedGift = currentGiftOptions[index];
            const itemElement = document.getElementById('equipped-item');
            
            itemElement.innerText = selectedGift;
            itemElement.style.transform = "scale(1.2)";
            setTimeout(() => { itemElement.style.transform = "scale(1)"; }, 300);
            
            document.getElementById('modal').classList.add('hidden');
            
            setTimeout(() => {
                startMiniGame();
            }, 1000);
        }

        function startMiniGame() {
            const mgScreen = document.getElementById('minigame-screen');
            mgScreen.classList.remove('hidden');
            mgScreen.classList.add('flex'); 
            
            mgTime = 15;
            currentMgScore = 0;
            document.getElementById('mg-timer').innerText = mgTime;
            document.getElementById('mg-score').innerText = currentMgScore;
            
            if (!mgEventsAttached) {
                setupMiniGameEvents();
                mgEventsAttached = true;
            }
            
            const cat = document.getElementById('mg-cat');
            cat.style.left = '50%';
            cat.style.top = '50%';
            isCatDragging = false;

            // 기존 쥐 완벽 제거
            document.querySelectorAll('.mouse-entity').forEach(el => el.remove());
            mice.forEach(m => clearInterval(m.interval));
            mice = [];

            mgTimerInterval = setInterval(() => {
                mgTime--;
                document.getElementById('mg-timer').innerText = mgTime;
                if (mgTime <= 0) endMiniGame();
            }, 1000);

            // 레이아웃 높이 계산 완료 후 딱 5마리 생성 시작
            setTimeout(() => {
                for(let i=0; i<MAX_MICE; i++) {
                    spawnMouse();
                }
                collisionReqId = requestAnimationFrame(checkCollision);
            }, 100);
        }

        function setupMiniGameEvents() {
            const playArea = document.getElementById('mg-playarea');
            
            playArea.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                isCatDragging = true;
                playArea.setPointerCapture(e.pointerId); 
                moveCat(e);
            });

            playArea.addEventListener('pointermove', (e) => {
                if (!isCatDragging) return;
                e.preventDefault();
                moveCat(e);
            });

            const stopDrag = (e) => {
                isCatDragging = false;
                playArea.releasePointerCapture(e.pointerId);
            };

            playArea.addEventListener('pointerup', stopDrag);
            playArea.addEventListener('pointercancel', stopDrag);
        }

        function moveCat(e) {
            const playArea = document.getElementById('mg-playarea');
            const cat = document.getElementById('mg-cat');
            const rect = playArea.getBoundingClientRect();
            
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            x = Math.max(0, Math.min(x, rect.width));
            y = Math.max(0, Math.min(y, rect.height));
            
            cat.style.left = x + 'px';
            cat.style.top = y + 'px';
        }

        function spawnMouse() {
            if (mgTime <= 0) return;
            if (mice.length >= MAX_MICE) return; // 5마리 제한 철벽 방어 로직

            const area = document.getElementById('mg-playarea');
            const mouse = document.createElement('div');
            mouse.innerText = "🐭";
            // 난이도 상승: 쥐 크기를 약간 줄임 (text-5xl)
            mouse.className = "absolute text-5xl md:text-6xl mouse-entity";
            mouse.style.transform = "translate(-50%, -50%)";
            mouse.style.zIndex = "20";
            mouse.style.userSelect = "none";
            
            const padding = 50;
            const maxX = area.clientWidth - padding;
            const maxY = area.clientHeight - padding;
            
            // 난이도 상승: 점수가 높아질수록 속도가 기하급수적으로 빨라짐 (최소 150ms 미친 속도)
            const speed = Math.max(150, 700 - (currentMgScore * 25));
            mouse.style.transition = `all ${speed}ms ease-in-out`;
            
            mouse.style.left = Math.max(padding/2, Math.floor(Math.random() * maxX)) + 'px';
            mouse.style.top = Math.max(padding/2, Math.floor(Math.random() * maxY)) + 'px';
            
            area.appendChild(mouse);
            
            const mouseObj = { element: mouse, interval: null };
            mice.push(mouseObj); // 배열에 확실히 추가
            
            const moveInterval = setInterval(() => {
                if(maxX <= 0 || maxY <= 0) return; 
                mouse.style.left = Math.max(padding/2, Math.floor(Math.random() * maxX)) + 'px';
                mouse.style.top = Math.max(padding/2, Math.floor(Math.random() * maxY)) + 'px';
            }, speed + 50); // 트랜지션 완료 직후 바로 다음 목적지로 출발
            
            mouseObj.interval = moveInterval;
        }

        function checkCollision() {
            if (mgTime <= 0) return;

            const cat = document.getElementById('mg-cat');
            if (!cat) return;
            const catRect = cat.getBoundingClientRect();
            // 충돌 패딩 축소 (쥐 크기에 맞춰 조금 더 정확한 터치 요구)
            const padding = 15; 
            
            for (let i = mice.length - 1; i >= 0; i--) {
                const mouseObj = mice[i];
                const mouseRect = mouseObj.element.getBoundingClientRect();
                
                if (
                    catRect.left + padding < mouseRect.right - padding &&
                    catRect.right - padding > mouseRect.left + padding &&
                    catRect.top + padding < mouseRect.bottom - padding &&
                    catRect.bottom - padding > mouseRect.top + padding
                ) {
                    catchMouse(i);
                }
            }
            
            collisionReqId = requestAnimationFrame(checkCollision);
        }

        function catchMouse(index) {
            if (mgTime <= 0) return;

            playCatchSound();
            currentMgScore++;
            totalMgScore++;
            document.getElementById('mg-score').innerText = currentMgScore;
            
            const mouseObj = mice[index];
            clearInterval(mouseObj.interval);
            mouseObj.element.remove();
            mice.splice(index, 1); // 1마리 삭제
            
            // 삭제 후 즉시 1마리 추가 소환 (항상 5마리 유지)
            spawnMouse();
        }

        function endMiniGame() {
            clearInterval(mgTimerInterval);
            cancelAnimationFrame(collisionReqId);
            
            mice.forEach(m => {
                clearInterval(m.interval);
                m.element.remove();
            });
            mice = [];
            
            const mgScreen = document.getElementById('minigame-screen');
            mgScreen.classList.add('hidden');
            mgScreen.classList.remove('flex'); 
            
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            const btn = document.getElementById('modal-btn');
            
            title.innerText = "미니게임 종료!";
            content.innerHTML = `순식간에 쥐를 <b>${currentMgScore}</b>마리 잡았어!<br><span class="text-5xl mt-4 block">😻</span>`;
            
            document.getElementById('gift-selection').classList.add('hidden');
            btn.classList.remove('hidden');
            
            if (currentStage < 5) {
                btn.innerText = `STAGE ${currentStage + 1} 이동`;
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    currentStage++;
                    questionIndex = 0;
                    stageScore = 0;
                    loadQuestion();
                };
            } else {
                btn.innerText = "최종 결과 보기";
                btn.onclick = () => {
                    modal.classList.add('hidden');
                    showFinalResult();
                };
            }
            modal.classList.remove('hidden');
        }

        function showFinalResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            
            const finalScreen = document.createElement('div');
            finalScreen.className = "w-full max-w-md retro-box p-6 flex flex-col items-center text-center";
            
            let grade = totalScore >= 20 ? "완벽한 인권 지킴이! 🏆" : totalScore >= 10 ? "훌륭한 노력파! 🏅" : "조금 더 공부해보자냥! 📚";
            
            finalScreen.innerHTML = `
                <h1 class="text-3xl font-bold mb-4 text-yellow-300">게임 종료!</h1>
                <div class="text-6xl mb-4">👑🐱👑</div>
                <p class="text-xl mb-2"><b>${studentName}</b> 학생의 기록</p>
                <p class="text-lg mb-2">퀴즈 정답: <span class="text-green-400 font-bold">${totalScore} / 25</span></p>
                <p class="text-lg mb-4">잡은 쥐 총합: <span class="text-red-400 font-bold">${totalMgScore}마리</span></p>
                <p class="text-2xl font-bold text-orange-400 mb-6">${grade}</p>
                <p id="save-status" class="text-sm font-bold text-gray-300 animate-pulse">선생님께 결과를 전송하는 중...</p>
            `;
            
            document.body.appendChild(finalScreen);
            saveDataToGoogleSheet();
        }

        function saveDataToGoogleSheet() {
            if(!GOOGLE_APP_SCRIPT_URL) {
                document.getElementById('save-status').innerText = "저장 실패: 선생님 URL이 설정되지 않았습니다.";
                return;
            }

            const payload = {
                studentId: studentId,
                studentName: studentName,
                score: totalScore,
                miniGameScore: totalMgScore
            };

            // no-cors 모드를 사용하여 브라우저 보안 경고를 우회하고 쿨하게 통과!
            fetch(GOOGLE_APP_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", 
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // 응답 코드를 확인하지 않고 무조건 성공으로 처리합니다.
                const statusEl = document.getElementById('save-status');
                statusEl.innerText = "✅ 선생님께 결과가 무사히 전달되었습니다!";
                statusEl.classList.remove('animate-pulse', 'text-gray-300');
                statusEl.classList.add('text-green-400');
            })
            .catch(error => {
                document.getElementById('save-status').innerText = "❌ 데이터 전송 실패. 인터넷 연결을 확인하세요.";
                console.error(error);
            });
        }
    </script>
</body>
</html>
